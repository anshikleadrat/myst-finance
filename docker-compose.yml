# Production stack for a single VPS: Caddy (HTTPS) -> TanStack Start SSR (web) + FastAPI (api) -> Postgres.
#
# Local development does NOT use this file: run the apps directly (see README) against a database in an
# existing Postgres container. This file is for deployment, so it runs its own isolated Postgres.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myst_finance
      POSTGRES_USER: myst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - myst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myst -d myst_finance"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://myst:${POSTGRES_PASSWORD}@db:5432/myst_finance
      SITE_URL: https://${DOMAIN:?set DOMAIN in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - myst_caddy_data:/data
      - myst_caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  myst_pgdata:
  myst_caddy_data:
  myst_caddy_config:
